name: Aggiorna Storico Lotto

on:
  schedule:
    # Gira tutti i giorni (*) alle 19:45 UTC.
    # In estate (CEST) sono le 21:45 italiane (parte subito).
    # In inverno (CET) sono le 20:45 italiane (lo script aspetterà 1 ora).
    - cron: '45 19 * * *'
  workflow_dispatch:

jobs:
  aggiorna:
    name: Scarica e pubblica storico.zip
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Attesa dinamica: si adatta automaticamente a ora legale/solare
      - name: Attendi orario italiano (21:30)
        run: |
          export TZ="Europe/Rome"
          NOW=$(date +%s)
          TARGET=$(date -d "21:30" +%s)
          
          DIFF=$((TARGET - NOW))
          if [ $DIFF -gt 0 ]; then
            echo "Orario italiano attuale: $(date +'%H:%M'). Attendo $DIFF secondi per arrivare alle 21:30..."
            sleep $DIFF
          else
            echo "Sono già le $(date +'%H:%M'), procedo con il download."
          fi

      - name: Scarica storico.zip
        id: download
        run: |
          set -e
          echo "Tentativo 1: brightstarlottery.it"
          if curl -fsSL --max-time 120 \
               -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               "https://www.brightstarlottery.it/STORICO_ESTRAZIONI_LOTTO/storico.zip" \
               -o data/storico.zip; then
            echo "source=brightstarlottery" >> "$GITHUB_OUTPUT"
            echo "Scaricato da brightstarlottery.it"
          else
            echo "Tentativo 2: lotto-italia.it"
            curl -fsSL --max-time 120 \
               -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               "https://www.lotto-italia.it/content/dam/lottoitalia/archivi/storico.zip" \
               -o data/storico.zip
            echo "source=lotto-italia" >> "$GITHUB_OUTPUT"
            echo "Scaricato da lotto-italia.it"
          fi

      - name: Verifica ZIP
        run: |
          if ! unzip -t data/storico.zip > /dev/null 2>&1; then
            echo "ERRORE: il file scaricato non è un ZIP valido"
            exit 1
          fi
          SIZE=$(stat -c%s data/storico.zip)
          echo "ZIP valido — dimensione: $SIZE byte"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ATTENZIONE: file troppo piccolo ($SIZE byte) — potrebbe essere incompleto"
            exit 1
          fi

      - name: Estrai ultima estrazione
        run: |
          unzip -p data/storico.zip | tail -20 | head -5 || true

      - name: Scrivi timestamp
        run: |
          echo "Ultimo aggiornamento: $(date -u '+%Y-%m-%d %H:%M UTC')" > data/ultimo_aggiornamento.txt
          echo "Sorgente: ${{ steps.download.outputs.source }}" >> data/ultimo_aggiornamento.txt

      - name: Commit e push
        run: |
          git config user.name  "LottoBot"
          git config user.email "lottobot@noreply.github.com"
          git add data/storico.zip data/ultimo_aggiornamento.txt
          if git diff --staged --quiet; then
            echo "Nessuna modifica al file — skip commit"
          else
            git commit -m "Aggiornamento automatico storico lotto - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "Commit e push completati"
          fi
