name: Aggiorna Storico Lotto

on:
  schedule:
    - cron: '45 19 * * 2,4,5,6'   # 21:45 CEST (mar/gio/ven/sab) — orario invernale: 20:45 CET
  workflow_dispatch: {}            # avvio manuale da UI GitHub

jobs:
  aggiorna:
    name: Scarica e pubblica storico.zip
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scarica storico.zip
        id: download
        run: |
          set -e
          echo "Tentativo 1: brightstarlottery.it"
          if curl -fsSL --max-time 120 \
               -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               "https://www.brightstarlottery.it/STORICO_ESTRAZIONI_LOTTO/storico.zip" \
               -o storico.zip; then
            echo "source=brightstarlottery" >> "$GITHUB_OUTPUT"
            echo "Scaricato da brightstarlottery.it"
          else
            echo "Tentativo 2: lotto-italia.it"
            curl -fsSL --max-time 120 \
               -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               "https://www.lotto-italia.it/content/dam/lottoitalia/archivi/storico.zip" \
               -o storico.zip
            echo "source=lotto-italia" >> "$GITHUB_OUTPUT"
            echo "Scaricato da lotto-italia.it"
          fi

      - name: Verifica ZIP
        run: |
          if ! unzip -t storico.zip > /dev/null 2>&1; then
            echo "ERRORE: il file scaricato non è un ZIP valido"
            exit 1
          fi
          SIZE=$(stat -c%s storico.zip)
          echo "ZIP valido — dimensione: $SIZE byte"
          if [ "$SIZE" -lt 500000 ]; then
            echo "ATTENZIONE: file troppo piccolo ($SIZE byte) — potrebbe essere incompleto"
            exit 1
          fi

      - name: Estrai ultima estrazione (log)
        run: |
          unzip -p storico.zip | tail -20 | head -5 || true

      - name: Scrivi timestamp
        run: |
          echo "Ultimo aggiornamento: $(date -u '+%Y-%m-%d %H:%M UTC')" > ultimo_aggiornamento.txt
          echo "Sorgente: ${{ steps.download.outputs.source }}" >> ultimo_aggiornamento.txt

      - name: Commit e push su lotto-data (backup / bridge raw.githubusercontent.com)
        run: |
          git config user.name  "LottoBot"
          git config user.email "lottobot@noreply.github.com"
          git add storico.zip ultimo_aggiornamento.txt
          if git diff --staged --quiet; then
            echo "Nessuna modifica al file — skip commit"
          else
            git commit -m "Aggiornamento automatico storico lotto - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "Commit e push completati"
          fi

      - name: Push diretto a PythonAnywhere
        run: |
          set -e
          echo "Invio storico.zip a PythonAnywhere..."
          HTTP_CODE=$(curl -s -o /tmp/pa_response.txt -w "%{http_code}" -X POST \
            -H "X-Secret-Token: ${{ secrets.PA_UPLOAD_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @storico.zip \
            --max-time 60 \
            https://LottoAnalyzerPlus.pythonanywhere.com/api/upload-archivio)
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/pa_response.txt
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Push a PythonAnywhere riuscito"
          else
            echo "❌ Push a PythonAnywhere fallito (HTTP $HTTP_CODE)"
            exit 1
          fi
